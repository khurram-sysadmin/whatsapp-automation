services:
  wamarketing-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_N8N_WEBHOOK_URL: https://n8n.eightbitsolutions.com/webhook/eightbit-outreach/v1/api
        VITE_N8N_IMPORT_WEBHOOK_URL: https://n8n.eightbitsolutions.com/webhook/eightbit-outreach/v1/import
    container_name: wamarketing-frontend
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.wamarketing.rule=Host(`wamarketing.eightbitsolutions.com`)"
      - "traefik.http.routers.wamarketing.entrypoints=websecure"
      - "traefik.http.routers.wamarketing.tls=true"
      - "traefik.http.routers.wamarketing.tls.certresolver=letsencrypt"
      - "traefik.http.services.wamarketing.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
